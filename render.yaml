services:
  - type: web
    runtime: python
    name: offer-bank-api
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DATABASE_URL
        fromDatabase:
          name: offer-bank-db
          property: connectionString
      - key: CORS_ALLOW_ORIGINS
        value: https://offer-bank-frontend.onrender.com

  - type: web
    runtime: static
    name: offer-bank-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://offer-bank-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: offer-bank-db
    plan: free
    region: singapore
